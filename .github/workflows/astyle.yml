name: astyle

on:
  push:
    branches: [ dev, master ]
  pull_request:

jobs:
  astyle-code:
    name: astyle check
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Record pull request identity
      if: github.event_name == 'pull_request'
      run: echo ${{ github.event.number }} > pull_request_id

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: github.event_name == 'pull_request'
      with:
        name: pull_request_id
        path: pull_request_id

    - name: Install authoritative AStyle 3.1
      run: |
        sudo apt-get update
        sudo apt-get install -y astyle=3.1-3build1
        test "$(astyle --version)" = "Artistic Style Version 3.1"

    - name: astyle check
      run: make astyle-check
